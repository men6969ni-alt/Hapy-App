<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هپی اپ | مرجع دانلود اپلیکیشن</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .card {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #007bff;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            line-height: 1.6;
            font-size: 15px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>هپی‌اپ (Hapy-App) 🚀</h1>
        <p>مرجع رسمی دانلود جدیدترین برنامه‌ها و ابزارهای اندرویدی. برای دریافت اپلیکیشن‌ها و ورود به کانال رسمی ما روی دکمه زیر کلیک کنید.</p>
        <!-- به جای کلمه لینک_روبیکا، آدرس کانال روبیکای خودت را قرار بده -->
        <a href="لینک_روبیکا" target="_blank" class="btn">ورود به کانال و دانلود</a>
    </div>

</body>
</html>
